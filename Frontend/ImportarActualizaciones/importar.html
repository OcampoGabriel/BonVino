<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Bodega</title>
    <link rel="stylesheet" href="importar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="actualizable">
        <a href="../inicio.html"><button><i class="bi bi-arrow-left"></i>  Regresar</button></a>
        <h1>Gestión de Bodega</h1>
        <h3>Bodegas con actualizaciones disponibles</h3>
        <div id="bodegasActualizables">
            <!--Aca van las bodegas-->
        </div>
        <button class="botonImportar" id="botonImportar">Importar</button>
    </div>

    <script src="../PantallaActualizacionBodega.js"></script>
    
    <script>
        // Cuando se habilita la ventana se ejecuta lo siguiente
            document.addEventListener('DOMContentLoaded', async function() {
                const pantalla = new PantallaActualizacionBodega();
                
                // Se le pasa el trabajo al gestor para que este devuelva las bodegas con actualizacion disponible
                async function llamarGestor() {
                    const res = await fetch(`http://localhost:8080/bodegasActualizables`);
                    const datos = await res.json();
                    return JSON.parse(datos); 
                }

                try {
                    // Guarda las bodegas actualizables que le paso el gestor
                    pantalla.bodegasActualizables = await llamarGestor();
                    // Se llama al metodo para mostrar las bodegas actualizables
                    pantalla.mostrarBodegasActualizables();
                } catch (error) {
                    console.error("Error al llamar al gestor:", error);
                }
            
            pantalla.botonImportar = document.getElementById("botonImportar");
            // Cuando se presiona el boton importar, se llama al metodo de pantalla para tomar la seleccion de la bodega y pasarsela al gestor
            pantalla.botonImportar.addEventListener("click", function() {
                pantalla.tomarSeleccionBodega();
            });
        });
    </script>
</body>
</html>
