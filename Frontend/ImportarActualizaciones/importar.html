<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Bodega</title>
    <link rel="stylesheet" href="importar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="actualizable">
        <a href="../inicio.html"><button><i class="bi bi-arrow-left"></i>  Regresar</button></a>
        <h1>Gestión de Bodega</h1>
        <h3>Bodegas con actualizaciones disponibles</h3>
        <div id="bodegasActualizables">
            <!--Aca van las bodegas-->
        </div>
        <button class="botonImportar" id="botonImportar">Importar</button>
    </div>

    <script src="../PantallaActualizacionBodega.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM completamente cargado y analizado");
            const pantalla = new PantallaActualizacionBodega();
            pantalla.mostrarBodegasActualizables();
            pantalla.botonImportar = document.getElementById("botonImportar");
            pantalla.botonImportar.addEventListener("click", function() {
                pantalla.tomarSeleccionBodega();
            });
        });
    </script>
</body>
</html>
