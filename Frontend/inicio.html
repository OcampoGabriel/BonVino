<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BonVino</title>
    <link rel="stylesheet" type="text/css" href="inicio.css">
</head>
<body>
    <header>
        <h1>BonVino</h1>
        <h2>Encuentra el Vino Correcto</h2>
    </header>
    <main>
        <div class="button-div">
            <button id="botonImportarActualizacionDeVinoDeBodega">Importar actualización de vinos de bodega</button>
            <a href="./consulta/consulta.html"><button id="consultar">Consultar Vinos</button></a>
            <a href="./Log/log.html"><button>Cerrar Sesión</button></a>
        </div>
    </main>

    <script src="./PantallaActualizacionBodega.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Se crea una instancia de la clase PantallaActualizacionBodega
            const pantalla = new PantallaActualizacionBodega();
            pantalla.botonImportarActualizacionDeVinoDeBodega = document.getElementById("botonImportarActualizacionDeVinoDeBodega");
            // Se preciono el boton ImportarActualizacionDeVinoDeBodega, lo que llama al metodo seleccionarOpcionActualizacionBodega()
            pantalla.botonImportarActualizacionDeVinoDeBodega.addEventListener("click", function() {
                pantalla.seleccionarOpcionActualizacionBodega();
            });
        });
    </script>
</body>
</html>
